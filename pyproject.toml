[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "affective-processing-module"
version = "0.1.0"
description = "APM: a portable, experience-grounded affective regulation and learning module for robots, with the AffectLink interface"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
learning = ["torch>=2.2"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10"]
sim = ["mujoco==3.3.0", "pillow>=10"]  # MuJoCo bodies (wheeled, NERVA via its repo, humanoid needs 3.16: see docs)

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["learning: needs the optional torch dependency"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]

[tool.mypy]
python_version = "3.10"
packages = ["apm", "apm_research", "apm_testbeds", "apm_select", "apm_express"]
ignore_missing_imports = true
warn_unused_ignores = true
